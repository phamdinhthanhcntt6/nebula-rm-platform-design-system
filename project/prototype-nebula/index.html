<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ khách · Nebula</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--t-gray-scale-gray3); }
  #root { height: 100vh; overflow: hidden; }
  #boot-error { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px;
    color: #b42318; background: #fff4f3; border: 1px solid #ffcdcd; border-radius: 8px;
    margin: 16px; padding: 12px; display: none; }
  /* nhảy tới bằng chứng: nháy nền vàng (token DS) rồi tắt */
  @keyframes skflash { 0% { background: var(--t-tag-background-yellow); } 100% { background: transparent; } }
  .sk-flash { animation: skflash 1.6s ease-out; }
  /* Sổ khách: cố định cột checkbox (32px) + cột Khách khi cuộn ngang.
     Ô đã có nền inline (thắng CSS) nên giữ màu hover/chọn; các hàng không có nền (Thêm khách, tổng) lấy nền primary. */
  .sk-fix-name [role="table"] > div > :nth-child(1) { position: sticky !important; left: 0; z-index: 2; background: var(--t-background-primary); }
  .sk-fix-name [role="table"] > div > :nth-child(2) { position: sticky !important; left: 32px; z-index: 2; background: var(--t-background-primary);
    box-shadow: 4px 0 4px -4px var(--t-background-transparent-strong); }
  /* ô bấm được trong bảng: gạch chân khi rê chuột */
  span:hover > .sk-link, .sk-link:hover { text-decoration: underline; }
  /* thanh lọc cuộn ngang khi màn hẹp: ẩn thanh cuộn */
  .sk-hscroll { scrollbar-width: none; }
  .sk-hscroll::-webkit-scrollbar { display: none; }
  .sk-hscroll > * { flex-shrink: 0; }
  /* dense scrollbars inside the white panel */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--t-background-quaternary); border-radius: 6px; }
@media (max-width: 760px) { .sk-wide-only { display: none !important; } }
</style>
</head>
<body>
<pre id="boot-error"></pre>
<div id="root"></div>
<script>
  // Surface compile/runtime errors on the page itself (curl can't catch Babel failures).
  window.onerror = function (msg, src, line, col, err) {
    var el = document.getElementById('boot-error');
    el.style.display = 'block';
    el.textContent = 'Lỗi: ' + msg + '\n' + (err && err.stack ? err.stack : ('' + src + ':' + line));
  };
</script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
