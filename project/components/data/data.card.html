<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--t-background-primary);font-family:var(--t-font-family);color:var(--t-font-color-primary);font-size:13px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;font-weight:600;color:var(--t-font-color-light)}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.NebulaRMPlatformDesignSystem_5dfab2;

const { RecordTable, RecordBoard, RecordBoardColumn, RecordCard, FieldRow, FieldGroup, Chip, Tag, Avatar, Icon } = DS;
const rows=[{id:'1',name:'VIP',code:'seg_vip',cond:'Nav amount greater than 500m',members:'4',sync:'Sep 7, 2026 12:11 PM'},{id:'2',name:'Growth',code:'seg_grow',cond:'Aum amount greater than 100m',members:'8',sync:'Sep 7, 2026 12:11 PM'},{id:'3',name:'Dormant',code:'seg_dorm',cond:'Last active at less than 7 days',members:'20',sync:'Sep 7, 2026 12:11 PM'},{id:'4',name:'New accounts',code:'seg_new',cond:'Created at greater than 30 days',members:'1,273',sync:'Sep 7, 2026 12:11 PM'}];
const cols=[{id:'name',label:'Name',type:'text',width:200},{id:'code',label:'Code',type:'number',width:150},{id:'cond',label:'Condition',type:'filter',width:220},{id:'members',label:'Members',type:'count',width:130},{id:'sync',label:'Last sync',type:'date',width:190}];
function Card(){
  const [sel,setSel]=React.useState(['2']);
  return (<div className="col" style={{gap:20}}>
  <div style={{border:'1px solid var(--t-border-color-medium)',borderRadius:8,overflow:'auto'}}>
    <RecordTable columns={cols} rows={rows} selectedIds={sel} onSelectionChange={setSel} renderCell={(r,c)=> c.id==='name' ? <Chip label={r.name} /> : r[c.id]} />
  </div>
  <div className="row" style={{alignItems:'flex-start',gap:20}}>
    <div style={{border:'1px solid var(--t-border-color-medium)',borderRadius:8,overflow:'hidden',height:240,display:'flex'}}>
      <RecordBoardColumn title="Qualified" color="blue" aggregate="-" isFirst width={280}>
        <RecordCard title="CRM solution for VNDirect" titleAvatar={<Avatar placeholder="CRM" size="md" />} fields={[{Icon:'tag',value:<Tag text="Qualified" color="blue" />},{Icon:'user-circle',value:<Chip label="Nguyễn Văn An" avatarType="rounded" />},{Icon:'currency-dollar',value:<span><Icon name="currency-dong" size={14} /> 450m</span>},{Icon:'building',value:<Chip label="Công ty TNHH L…" />}]} />
        <RecordCard title="Maintenance contract" titleAvatar={<Avatar placeholder="Maintenance" size="md" />} active fields={[{Icon:'tag',value:<Tag text="Qualified" color="blue" />},{Icon:'user-circle',placeholder:'Sales rep'}]} />
      </RecordBoardColumn>
      <RecordBoardColumn title="No value" noValue aggregate="-" width={200} />
    </div>
    <div style={{width:380}}>
      <FieldGroup title="Opportunity">
        <FieldRow label="Name" Icon="typography" value="ERP rollout — phase 2" />
        <FieldRow label="Type" Icon="target" value={<Tag text="Lead" color="red" />} />
        <FieldRow label="Stage" Icon="progress" placeholder="Stage" />
        <FieldRow label="Status" Icon="tag" value={<Tag text="Open" color="red" />} />
        <FieldRow label="Expected revenue" Icon="currency-dollar" value="1,300,000,000" />
        <FieldRow label="Probability" Icon="decimal" value="0" />
        <FieldRow label="Expected close" Icon="calendar-event" placeholder="Expected close" />
      </FieldGroup>
    </div>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script></body></html>
