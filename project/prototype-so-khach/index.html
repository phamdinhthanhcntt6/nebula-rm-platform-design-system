<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sổ khách</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: bàn làm việc của broker — thanh trên dính, nội dung rộng tối đa 1240px, khung bên phải trượt ra cho Gợi ý và Ghi cuộc gọi */
:root{
  --bg:#f1f1f1; --surface:#ffffff; --surface-2:#fcfcfc; --line:#ebebeb; --line-strong:#d6d6d6; --line-light:#f1f1f1;
  --fg:#333333; --muted:#666666; --faint:#999999; --placeholder:#b3b3b3; --disabled-fg:#cccccc;
  --accent:#3e63dd; --accent-hover:#3358d4; --accent-fg:#ffffff; --accent-soft:#edf2fe; --accent-faint:#f7f9ff; --accent-line:#d2deff; --accent-text:#3e63dd; --accent-disabled:#8da4ef;
  --k:#ce2c31; --k-bg:#feebec; --c:#d14e00; --c-bg:#ffefd6; --y:#a06e00; --y-bg:#fffab8;
  --n:#666666; --n-bg:#f9f9f9; --o:#00824d; --o-bg:#e6f6eb;
  --up:#00824d; --down:#ce2c31; --flash:#fffab8;
  --hover:rgb(0 0 0 / .039); --active:rgb(0 0 0 / .078); --btn-border:rgb(0 0 0 / .078); --input-bg:rgb(0 0 0 / .02);
  --danger-line:#ffcdce; --inverted-line:#333333;
  --shadow:2px 4px 16px 0 rgb(0 0 0 / .161), 0 2px 4px 0 rgb(0 0 0 / .078);
  --shadow-light:0 2px 4px 0 rgb(0 0 0 / .039), 0 0 4px 0 rgb(0 0 0 / .078);
  --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm:4px; --r-md:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1d1d; --surface:#171717; --surface-2:#1b1b1b; --line:#222222; --line-strong:#484848; --line-light:#1d1d1d;
    --fg:#ebebeb; --muted:#b3b3b3; --faint:#818181; --placeholder:#666666; --disabled-fg:#4c4c4c;
    --accent:#3e63dd; --accent-hover:#5472e4; --accent-fg:#ffffff; --accent-soft:#182449; --accent-faint:#141726; --accent-line:#253974; --accent-text:#9db1ff; --accent-disabled:#435db2;
    --k:#ff8a88; --k-bg:#3b1219; --c:#ff9b52; --c-bg:#331e0b; --y:#f5e147; --y-bg:#2c2305;
    --n:#b3b3b3; --n-bg:#191919; --o:#3dd68c; --o-bg:#132d21;
    --up:#3dd68c; --down:#ff8a88; --flash:#433500;
    --hover:rgb(255 255 255 / .059); --active:rgb(255 255 255 / .102); --btn-border:rgb(255 255 255 / .102); --input-bg:rgb(255 255 255 / .031);
    --danger-line:#611623; --inverted-line:#ebebeb;
    --shadow:2px 4px 16px 0 rgb(0 0 0 / .16), 0 2px 4px 0 rgb(0 0 0 / .08);
    --shadow-light:0 2px 4px 0 rgb(0 0 0 / .04), 0 0 4px 0 rgb(0 0 0 / .08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1d1d; --surface:#171717; --surface-2:#1b1b1b; --line:#222222; --line-strong:#484848; --line-light:#1d1d1d;
  --fg:#ebebeb; --muted:#b3b3b3; --faint:#818181; --placeholder:#666666; --disabled-fg:#4c4c4c;
  --accent:#3e63dd; --accent-hover:#5472e4; --accent-fg:#ffffff; --accent-soft:#182449; --accent-faint:#141726; --accent-line:#253974; --accent-text:#9db1ff; --accent-disabled:#435db2;
  --k:#ff8a88; --k-bg:#3b1219; --c:#ff9b52; --c-bg:#331e0b; --y:#f5e147; --y-bg:#2c2305;
  --n:#b3b3b3; --n-bg:#191919; --o:#3dd68c; --o-bg:#132d21;
  --up:#3dd68c; --down:#ff8a88; --flash:#433500;
  --hover:rgb(255 255 255 / .059); --active:rgb(255 255 255 / .102); --btn-border:rgb(255 255 255 / .102); --input-bg:rgb(255 255 255 / .031);
  --danger-line:#611623; --inverted-line:#ebebeb;
  --shadow:2px 4px 16px 0 rgb(0 0 0 / .16), 0 2px 4px 0 rgb(0 0 0 / .08);
  --shadow-light:0 2px 4px 0 rgb(0 0 0 / .04), 0 0 4px 0 rgb(0 0 0 / .08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Thanh trên */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--fg)}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--faint)}
.search{position:relative;flex:1 1 320px;min-width:0;max-width:520px}
.search input#q{width:100%;height:32px;padding:0 36px 0 32px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--input-bg);transition:background .1s ease,border-color .1s ease}
.search input:hover{background:var(--hover)}
.search input:focus{background:var(--surface);border-color:var(--accent);outline:none}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:11px;color:var(--faint);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 5px;line-height:16px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-light);overflow:hidden;z-index:35;padding:4px}
.res-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 8px;border:0;border-radius:var(--r-sm);cursor:pointer;background:none;width:100%;text-align:left;transition:background .1s ease}
.res-item:hover,.res-item.active{background:var(--hover)}
.res-item .rel{grid-column:1/-1;font-size:12px}
.res-note{padding:6px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-light);margin-bottom:4px}
.verify{padding:8px;font-size:12px;background:var(--y-bg);color:var(--y);border-radius:var(--r-sm);display:flex;gap:8px;align-items:flex-start}
.who{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--muted)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:500;font-size:12px}

/* Khung trang */
.page{max-width:1240px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.proto-tag{background:transparent;border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:0 8px;line-height:18px}

/* Nút */
.btn{display:inline-flex;align-items:center;gap:4px;height:32px;border:1px solid var(--btn-border);background:transparent;border-radius:var(--r-md);padding:0 8px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .1s ease}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--active)}
.btn.primary{background:var(--accent);border-color:var(--btn-border);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{cursor:not-allowed;color:var(--disabled-fg);background:transparent;border-color:var(--btn-border)}
.btn.primary:disabled{background:var(--accent-disabled);color:var(--accent-fg)}
.btn.sm{height:24px;font-size:13px}

/* Mức */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-sm);padding:0 8px;height:20px;font-size:13px;font-weight:500;white-space:nowrap;line-height:20px}
.lv0{color:var(--k);background:var(--k-bg)} .lv1{color:var(--c);background:var(--c-bg)} .lv2{color:var(--y);background:var(--y-bg)}
.lv3{color:var(--n);background:var(--n-bg)} .lv4{color:var(--o);background:var(--o-bg)}
.tier{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 4px;line-height:16px}
.tier.vip{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-soft)}
.tag{display:inline-flex;align-items:center;font-size:12px;border-radius:var(--r-sm);padding:0 8px;height:20px;background:var(--n-bg);color:var(--muted);border:0}
.due-red{color:var(--k);font-weight:500}

/* Dải đếm + lọc */
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.count{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:8px 12px;cursor:pointer;min-width:118px;transition:border-color .1s ease}
.count:hover{border-color:var(--line-strong)}
.count b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.count[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.count.lv0,.count.lv1,.count.lv2,.count.lv3,.count.lv4{background:var(--surface)}
.count.lv0 b{color:var(--k)} .count.lv1 b{color:var(--c)} .count.lv2 b{color:var(--y)} .count.lv3 b{color:var(--n)} .count.lv4 b{color:var(--o)}
.count span{color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.filters .lbl{color:var(--faint);margin-right:2px}
.fchip{display:inline-flex;align-items:center;height:24px;border:1px solid var(--btn-border);background:transparent;border-radius:var(--r-sm);padding:0 8px;cursor:pointer;font-size:13px;color:var(--muted);transition:background .1s ease}
.fchip:hover{background:var(--hover)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text);font-weight:500}
.sep{width:1px;height:16px;background:var(--line)}

/* Bảng khách */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
table.list{width:100%;border-collapse:collapse;min-width:980px}
.list th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;position:sticky;top:0}
.list th button{all:unset;cursor:pointer}
.list th button:hover{color:var(--fg)}
.list td{padding:8px;border-bottom:1px solid var(--line-light);vertical-align:top}
.list tr:last-child td{border-bottom:0}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:var(--hover)}
.list td.r,.list th.r{text-align:right}
.cname{font-weight:500}
.csub{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-top:2px}
.reason{max-width:340px}
.reason small{display:block;color:var(--faint);font-size:12px}
.ratio-k{color:var(--k);font-weight:500} .ratio-c{color:var(--c);font-weight:500} .ratio-y{color:var(--y);font-weight:500}
.list-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 2px 8px}

/* Trang khách */
.back{font-size:13px;text-decoration:none;display:inline-flex;gap:4px;margin-bottom:8px}
.chead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.chead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:4px;align-items:center}
.cmeta .labels{display:flex;gap:4px;flex-wrap:wrap}
.cactions{display:flex;gap:8px;flex-wrap:wrap}
.strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.6fr);gap:0;margin-bottom:12px}
.strip>div{padding:8px 12px;border-right:1px solid var(--line-light);min-width:0}
.strip>div:last-child{border-right:0}
.strip .k{font-size:12px;color:var(--faint)}
.strip .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .stamp{font-size:11px;color:var(--faint)}
.rbar{position:relative;height:8px;border-radius:var(--r-sm);background:var(--line);margin-top:6px;overflow:visible}
.rbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-sm);background:var(--o)}
.rbar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.rbar .mk-lbl{position:absolute;top:10px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{position:relative;background:none;border:0;border-radius:var(--r-md);margin:4px 0;padding:4px 8px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;gap:4px;align-items:center;transition:background .1s ease}
.tab:hover{background:var(--hover)}
.tab:active{background:var(--active)}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:transparent}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{background:var(--inverted-line)}
.badge{font-size:11px;font-weight:500;border-radius:var(--r-sm);padding:0 6px;line-height:16px}

/* Tab Vấn đề */
.checked{font-size:12px;color:var(--faint);margin-bottom:8px}
.first{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow-light)}
.first .eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.first h2{font-size:16px;font-weight:600;margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opener{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;line-height:1.6;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.opener q{quotes:"“" "”"}
.opener-note{font-size:12px;color:var(--muted);margin-top:4px}
.blockband{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;font-size:13px}
.blockband .lbl{font-weight:500}
.bitem{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:4px 8px;cursor:pointer;text-align:left}
.bitem.now{border-color:var(--c);color:var(--c);background:var(--c-bg)}
.bitem.soon{border-color:var(--y);color:var(--y);background:var(--y-bg)}
.bitem.will{border-color:var(--k);color:var(--k);background:var(--k-bg)}
.bitem.grey{color:var(--muted);cursor:default;background:var(--surface-2)}
.cat{margin-bottom:16px}
.cat h3{font-size:13px;font-weight:500;color:var(--faint);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cat h3 .n{font-family:var(--font-mono);color:var(--faint)}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:8px;scroll-margin-top:150px}
.issue.flash{animation:flash 1.6s ease-out}
.issue-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.issue-head h4{font-size:13px;font-weight:600;margin:0;flex:1 1 260px}
.issue dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0 0 8px}
.issue dt{color:var(--faint);font-size:12px;line-height:19.5px}
.issue dd{margin:0}
.evs{display:flex;flex-wrap:wrap;gap:4px}
.ev{border:0;background:var(--hover);border-radius:var(--r-sm);padding:2px 8px;font-size:12px;color:var(--muted);cursor:pointer;transition:background .1s ease}
.ev:hover{background:var(--active);color:var(--fg)}
.issue-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.okline{background:var(--o-bg);color:var(--o);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:8px;font-size:13px}
.ndline{background:var(--n-bg);color:var(--n);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:8px;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:16px;text-align:center;color:var(--muted);margin-bottom:12px}

/* Tab Tổng quan */
.alert{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r-sm);padding:8px 12px;margin-bottom:12px;font-size:13px}
.alert.lv0{background:var(--k-bg);color:var(--k)} .alert.lv1{background:var(--c-bg);color:var(--c)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;min-width:0;margin-bottom:12px}
.block h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.block h3 .stamp{font-size:12px;color:var(--faint);font-weight:400}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--faint);font-size:12px;line-height:19.5px} .kv dd{margin:0}
.kv .rowx{display:contents}
.kvl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.kvr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;padding:2px 4px;margin:0 -4px;border-radius:var(--r-sm);min-height:24px;align-items:baseline}
.kvr>span:first-child{color:var(--faint);font-size:12px}
.bad-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:var(--r-sm);padding:0 6px;line-height:18px;margin-left:6px;background:var(--k-bg);color:var(--k)}
.warn-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:var(--r-sm);padding:0 6px;line-height:18px;margin-left:6px;background:var(--y-bg);color:var(--y)}
@media (max-width:560px){.kvr{grid-template-columns:1fr;gap:0}}
.hl{border-radius:var(--r-sm)}
.hl.flash,.flashrow td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--flash)}100%{background:transparent}}
.rel{display:inline-flex;align-items:center;font-size:12px;border-radius:var(--r-sm);padding:0 6px;line-height:18px;margin-left:6px;cursor:pointer;border:0}
.rel.lv0{background:var(--k-bg);color:var(--k)} .rel.lv1{background:var(--c-bg);color:var(--c)} .rel.lv2{background:var(--y-bg);color:var(--y)}
.miss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.miss>div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.miss b{display:block;font-size:13px;font-weight:500}
