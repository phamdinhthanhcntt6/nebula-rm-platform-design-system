<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
<style>body{margin:0;padding:16px;background:var(--t-background-primary);font-family:var(--t-font-family);color:var(--t-font-color-primary);font-size:13px}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--t-font-color-tertiary)}.sw b{display:block;height:36px;border-radius:4px;border:1px solid var(--t-border-color-light)}.sw span{color:var(--t-font-color-primary);font-weight:500;font-size:12px}.h{font-size:11px;font-weight:600;color:var(--t-font-color-light);margin:0 0 8px}</style></head><body><p class="h">SPACING</p><div style="display:flex;align-items:flex-end;gap:12px"><div class="sw" style="align-items:center"><b style="width:2px;height:2px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>0.5</span>2px</div><div class="sw" style="align-items:center"><b style="width:4px;height:4px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>1</span>4px</div><div class="sw" style="align-items:center"><b style="width:8px;height:8px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>2</span>8px</div><div class="sw" style="align-items:center"><b style="width:12px;height:12px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>3</span>12px</div><div class="sw" style="align-items:center"><b style="width:16px;height:16px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>4</span>16px</div><div class="sw" style="align-items:center"><b style="width:20px;height:20px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>5</span>20px</div><div class="sw" style="align-items:center"><b style="width:24px;height:24px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>6</span>24px</div><div class="sw" style="align-items:center"><b style="width:32px;height:32px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>8</span>32px</div><div class="sw" style="align-items:center"><b style="width:40px;height:40px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>10</span>40px</div><div class="sw" style="align-items:center"><b style="width:48px;height:48px;background:var(--t-accent-accent5);border:none;border-radius:2px"></b><span>12</span>48px</div></div>
  <p class="h" style="margin-top:16px">RADIUS · HEIGHTS</p><div style="display:flex;gap:12px;align-items:flex-end"><div class="sw" style="align-items:center"><b style="width:40px;height:40px;border-radius:var(--t-border-radius-xs);border:1px solid var(--t-border-color-strong);background:var(--t-background-secondary)"></b><span>xs</span>2px</div><div class="sw" style="align-items:center"><b style="width:40px;height:40px;border-radius:var(--t-border-radius-sm);border:1px solid var(--t-border-color-strong);background:var(--t-background-secondary)"></b><span>sm</span>4px</div><div class="sw" style="align-items:center"><b style="width:40px;height:40px;border-radius:var(--t-border-radius-md);border:1px solid var(--t-border-color-strong);background:var(--t-background-secondary)"></b><span>md</span>8px</div><div class="sw" style="align-items:center"><b style="width:40px;height:40px;border-radius:var(--t-border-radius-lg);border:1px solid var(--t-border-color-strong);background:var(--t-background-secondary)"></b><span>lg</span>16px</div><div class="sw" style="align-items:center"><b style="width:40px;height:40px;border-radius:var(--t-border-radius-pill);border:1px solid var(--t-border-color-strong);background:var(--t-background-secondary)"></b><span>pill</span>999px</div><span style="width:24px"></span><div class="sw" style="align-items:center"><b style="width:56px;height:24px;border:1px dashed var(--t-border-color-strong);background:transparent"></b><span>24px</span><span style="font-weight:400;color:var(--t-font-color-tertiary);font-size:10px;text-align:center;max-width:70px">small button, checkbox row, card row</span></div><div class="sw" style="align-items:center"><b style="width:56px;height:28px;border:1px dashed var(--t-border-color-strong);background:transparent"></b><span>28px</span><span style="font-weight:400;color:var(--t-font-color-tertiary);font-size:10px;text-align:center;max-width:70px">drawer item</span></div><div class="sw" style="align-items:center"><b style="width:56px;height:32px;border:1px dashed var(--t-border-color-strong);background:transparent"></b><span>32px</span><span style="font-weight:400;color:var(--t-font-color-tertiary);font-size:10px;text-align:center;max-width:70px">button, input, table row, menu item</span></div><div class="sw" style="align-items:center"><b style="width:56px;height:39px;border:1px dashed var(--t-border-color-strong);background:transparent"></b><span>39px</span><span style="font-weight:400;color:var(--t-font-color-tertiary);font-size:10px;text-align:center;max-width:70px">view bar</span></div><div class="sw" style="align-items:center"><b style="width:56px;height:40px;border:1px dashed var(--t-border-color-strong);background:transparent"></b><span>40px</span><span style="font-weight:400;color:var(--t-font-color-tertiary);font-size:10px;text-align:center;max-width:70px">page header, tabs</span></div></div></body></html>
