<style>body{margin:0;padding:16px;background:var(--t-background-primary);font-family:var(--t-font-family);color:var(--t-font-color-primary);font-size:13px}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--t-font-color-tertiary)}.sw b{display:block;height:36px;border-radius:4px;border:1px solid var(--t-border-color-light)}.sw span{color:var(--t-font-color-primary);font-weight:500;font-size:12px}.h{font-size:11px;font-weight:600;color:var(--t-font-color-light);margin:0 0 8px}</style></head><body><div style="display:flex;gap:24px;align-items:flex-start"><div class="sw" style="width:150px"><b style="height:56px;background:var(--t-background-primary);border:1px solid var(--t-border-color-medium);border-radius:8px;box-shadow:var(--t-box-shadow-light)"></b><span>light</span>dropdown-less popovers, drawer tab tile</div><div class="sw" style="width:150px"><b style="height:56px;background:var(--t-background-primary);border:1px solid var(--t-border-color-medium);border-radius:8px;box-shadow:var(--t-box-shadow-strong)"></b><span>strong</span>dropdown menus, snackbars</div><div class="sw" style="width:150px"><b style="height:56px;background:var(--t-background-primary);border:1px solid var(--t-border-color-medium);border-radius:8px;box-shadow:var(--t-box-shadow-super-heavy)"></b><span>super-heavy</span>modals, command menu</div><div style="font-size:12px;color:var(--t-font-color-secondary);line-height:1.7;padding-top:4px"><b style="color:var(--t-font-color-primary)">Durations</b><br>instant 75ms · fast 150ms · normal 300ms · slow 1.5s<br>clickable: <code>background 0.1s ease</code></div></div></body></html>
