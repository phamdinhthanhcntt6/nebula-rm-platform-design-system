<!-- @dsCard group="1. Foundations" viewport="720x150" name="Gray scale" subtitle="GRAY_SCALE_LIGHT gray1–12 — every neutral surface, border and text tone derives from this ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
<style>body{margin:0;padding:16px;background:var(--t-background-primary);font-family:var(--t-font-family);color:var(--t-font-color-primary);font-size:13px}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--t-font-color-tertiary)}.sw b{display:block;height:36px;border-radius:4px;border:1px solid var(--t-border-color-light)}.sw span{color:var(--t-font-color-primary);font-weight:500;font-size:12px}.h{font-size:11px;font-weight:600;color:var(--t-font-color-light);margin:0 0 8px}</style></head><body><div class="g" style="grid-template-columns:repeat(12,1fr)"><div class="sw"><b style="background:var(--t-gray-scale-gray1)"></b><span>gray1</span>--t-gray-scale-gray1</div><div class="sw"><b style="background:var(--t-gray-scale-gray2)"></b><span>gray2</span>--t-gray-scale-gray2</div><div class="sw"><b style="background:var(--t-gray-scale-gray3)"></b><span>gray3</span>app canvas</div><div class="sw"><b style="background:var(--t-gray-scale-gray4)"></b><span>gray4</span>--t-gray-scale-gray4</div><div class="sw"><b style="background:var(--t-gray-scale-gray5)"></b><span>gray5</span>--t-gray-scale-gray5</div><div class="sw"><b style="background:var(--t-gray-scale-gray6)"></b><span>gray6</span>border strong</div><div class="sw"><b style="background:var(--t-gray-scale-gray7)"></b><span>gray7</span>--t-gray-scale-gray7</div><div class="sw"><b style="background:var(--t-gray-scale-gray8)"></b><span>gray8</span>--t-gray-scale-gray8</div><div class="sw"><b style="background:var(--t-gray-scale-gray9)"></b><span>gray9</span>--t-gray-scale-gray9</div><div class="sw"><b style="background:var(--t-gray-scale-gray10)"></b><span>gray10</span>--t-gray-scale-gray10</div><div class="sw"><b style="background:var(--t-gray-scale-gray11)"></b><span>gray11</span>text secondary</div><div class="sw"><b style="background:var(--t-gray-scale-gray12)"></b><span>gray12</span>text primary</div></div></body></html>
