<script>/* Page-scoped app state: each kit page keeps rm-merged-* keys in memory so parallel cards never share/overwrite each other (and the user's storage is untouched). */
(function(){const mem={"rm-merged-role":"broker","rm-merged-screen-customers":"dashboard","rm-merged-record":""};const P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem,own=(k)=>/^rm-merged/.test(k);
P.getItem=function(k){return own(k)?(k in mem?mem[k]:null):g.call(this,k)};P.setItem=function(k,v){if(own(k)){mem[k]=String(v);return}return s.call(this,k,v)};P.removeItem=function(k){if(own(k)){delete mem[k];return}return r.call(this,k)};})();</script>
